[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "object-aligned-rag"
version = "0.1.0"
description = "Meilisearch-backed object-aligned multimodal RAG pilot for lecture video QA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Object-Aligned RAG Research" }]
dependencies = ["neo4j>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
stt = ["mlx-whisper>=0.4.3"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
oarag = "oarag.cli:main"
run-vlm-alignment = "oarag.cli:main_run_vlm_alignment"
paper-metric-intervals = "oarag.cli:main_paper_metric_intervals"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
